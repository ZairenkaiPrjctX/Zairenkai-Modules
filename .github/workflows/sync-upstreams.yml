name: Sync upstream component pins

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstreams
  cancel-in-progress: false

jobs:
  propose:
    name: check Core, FAS and Tuning and open a reviewed PR
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate the helper and run unit tests
        run: |
          python3 -m py_compile scripts/sync_upstreams.py scripts/sync_component_artifacts.py scripts/fetch_component_artifact.py
          python3 -m unittest discover -s tests -v
      - name: Resolve upstream dev heads and prepare the versioned candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_upstreams.py
      - name: Pin published artifacts only after manifest and archive SHA-256 verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_component_artifacts.py --mode modules --repo-root .
      - name: Open or refresh the bot PR (never push to dev)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: automation/sync-upstream-pins
        run: |
          if git diff --quiet -- components.lock.json CHANGELOG.md; then
            echo 'No component updates; no PR needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$BRANCH"
          git add components.lock.json CHANGELOG.md
          git commit -m 'build: sync Core FAS and Tuning component pins'
          git push --force origin "HEAD:refs/heads/$BRANCH"
          if gh pr view "$BRANCH" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --repo "$GH_REPO" --title 'build: sync upstream component pins' \
              --body 'Automated candidate: refreshes Core, FAS, and Tuning source pins, and pins a released artifact only when its exact source commit, manifest, archive size and SHA-256 all verify. Review the diff and wait for full module CI before merging.'
          else
            gh pr create --repo "$GH_REPO" --base dev --head "$BRANCH" \
              --title 'build: sync upstream component pins' \
              --body 'Automated candidate: refreshes Core, FAS, and Tuning source pins, and pins a released artifact only when its exact source commit, manifest, archive size and SHA-256 all verify. This PR does not publish a release; review the diff and wait for full module CI before merging.'
          fi
          # GITHUB_TOKEN-created PRs do not reliably trigger pull_request workflows. Explicitly
          # dispatch the real build against this exact candidate branch and fail this job on CI failure.
          gh workflow run ci.yml --repo "$GH_REPO" --ref "$BRANCH"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$GH_REPO" --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            [ -n "$run_id" ] && [ "$run_id" != null ] && break
            sleep 2
          done
          if [ -z "$run_id" ] || [ "$run_id" = null ]; then
            echo 'Unable to locate the dispatched CI run; inspect Actions manually.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          gh run watch "$run_id" --repo "$GH_REPO" --exit-status
