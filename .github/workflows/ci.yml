name: CI

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_STABLE: "1.97.0"
  NDK_VERSION: r27d
  NDK_SHA256: 601246087a682d1944e1e16dd85bc6e49560fe8b6d61255be2829178c8ed15d9

jobs:
  checks:
    name: shellcheck and assembler tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck -s sh module/*.sh module/META-INF/com/google/android/update-binary
      - run: python3 -m unittest discover -s tests -v

  # The single zairenkai module: Core and FAS are built at the commits components.lock.json pins
  # (each with its own scripts/build-android.sh), then assembled here.
  module:
    name: zairenkai module (Core + FAS at their locked commits)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [checks]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Locked commits
        id: lock
        run: |
          python3 - >>"$GITHUB_OUTPUT" <<'EOF'
          import json, re
          lock = json.load(open("components.lock.json"))
          for c in lock["components"]:
              assert re.fullmatch(r"[0-9a-f]{40}", c["commit"]), c["name"]
              print(f'{c["name"].removeprefix("zairenkai-")}={c["commit"]}')
          EOF
      - name: Require the CI GitHub App
        env:
          APP_ID: ${{ vars.ZAIRENKAI_CI_APP_ID }}
          HAS_KEY: ${{ secrets.ZAIRENKAI_CI_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$APP_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Module build blocked: the CI GitHub App is not configured in this repository (variable ZAIRENKAI_CI_APP_ID, secret ZAIRENKAI_CI_APP_PRIVATE_KEY). See docs/BUILDING.md."
            exit 1
          fi
      - name: Read-only token for the component repositories
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ZAIRENKAI_CI_APP_ID }}
          private-key: ${{ secrets.ZAIRENKAI_CI_APP_PRIVATE_KEY }}
          owner: ZairenkaiPrjctX
          repositories: Zairenkai-Core,Zairenkai-FAS
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZairenkaiPrjctX/Zairenkai-Core
          ref: ${{ steps.lock.outputs.core }}
          path: components/core
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ZairenkaiPrjctX/Zairenkai-FAS
          ref: ${{ steps.lock.outputs.fas }}
          path: components/fas
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - name: Rust and Android NDK (checksum verified)
        run: |
          rustup toolchain install "$RUST_STABLE" --profile minimal -t aarch64-linux-android
          rustup default "$RUST_STABLE"
          curl -fsSL -o /tmp/ndk.zip "https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
          echo "${NDK_SHA256}  /tmp/ndk.zip" | sha256sum -c -
          unzip -q /tmp/ndk.zip -d /tmp
          rm /tmp/ndk.zip
          echo "ANDROID_NDK_HOME=/tmp/android-ndk-${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Build the components
        run: |
          components/core/scripts/build-android.sh
          components/fas/scripts/build-android.sh
      - name: Assemble and check the module
        run: |
          python3 scripts/assemble.py \
            --component components/core/dist/zairenkai-core \
            --component components/fas/dist/zairenkai-fas \
            --out dist
          unzip -l dist/zairenkai-v*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zairenkai-module-unsigned-not-for-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 14
